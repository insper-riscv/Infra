name: CI plan
description: >
  Resolves the CI images (always the tag latest, so the automatic rebuild of the images reaches every
  repository without any edit) and decides, for each gate, whether a pass of the same inputs already exists
  (an artifact ci-pass-<gate>-<key> uploaded by a job that passed), so that the job can be skipped. The
  digest that latest has at the moment of the run goes into the key of the gate, so a new image never
  reuses a pass of the old one. Used by the job `reuse` of the CI of each repository.

inputs:
  gates:
    description: >
      One gate per line, "name|image|tokens". The key of a gate is the hash of the git index entries (mode,
      object, path; a submodule is its commit) of the tokens plus the digest of the image. A token without
      "!" is a path that goes in (none: the whole tree); a token with "!" is a glob that leaves out.
    required: false
    default: ""
  token:
    description: Token that reads the artifacts of the repository
    required: false
    default: ${{ github.token }}

outputs:
  images:
    description: 'JSON {"ci-vhdl": "ghcr.io/<owner>/ci-vhdl:latest", ...}'
    value: ${{ steps.plan.outputs.images }}
  gates:
    description: 'JSON {"<gate>": {"key": "...", "artifact": "ci-pass-<gate>-<key>", "skip": "true|false"}}'
    value: ${{ steps.plan.outputs.gates }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        GATES: ${{ inputs.gates }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/plan.sh"
