name: Sail image

# Builds the Sail RISC-V model (the executable `sail_riscv_sim`, compiled from one commit of
# riscv/sail-riscv, docker/base/sail/Dockerfile) alone and publishes it as base-sail, tagged with that
# commit and as latest, for linux/amd64 and linux/arm64.
#
# The commit is the latest one of the master branch on which the upstream `ci.yml` succeeded (the
# upstream merges through a merge queue, so its CI runs on `merge_group` as well as on `push`), so
# the image never gets a Sail that its own CI rejected (green-commit.sh).
#
# - Run by hand to update Sail: it builds the commit given, or the latest green one, unless that
#   image already exists.
# - Runs every day (schedule): it takes the latest green commit and builds it only if that image
#   does not exist yet.
#   A change of Dockerfile or of this workflow does not build by itself: the Recipe changed
#   workflow warns about it, and a run by hand with `force` rebuilds.
#
# The CI images workflow then assembles a new image.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "riscv/sail-riscv commit to build, full hash (empty: the latest commit of master whose upstream CI succeeded)"
        required: false
      force:
        description: "Rebuild and republish even if the image for that commit already exists"
        type: boolean
        default: false

concurrency:
  group: sail-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base-sail
  # the upstream branch and workflow whose success vouches for a commit of Sail; the upstream
  # runs it on push and on merge_group (its merge queue)
  UPSTREAM_REPO: riscv/sail-riscv
  UPSTREAM_BRANCH: master
  UPSTREAM_WORKFLOWS: ci.yml
  UPSTREAM_EVENTS: push merge_group

jobs:
  pin:
    # Only decides what to build: the published image, tagged by commit, is what a later run
    # checks to skip the build.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      version: ${{ steps.pin.outputs.version }}
      commit: ${{ steps.pin.outputs.commit }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the commit
        id: pin
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          # a newer commit still running is waited for a few minutes only; then the newest green one is taken
          WAIT_MINUTES: "5"
        run: |
          full_hash() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }

          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ]; then
            commit=$(UPSTREAM_REPO="$UPSTREAM_REPO" UPSTREAM_BRANCH="$UPSTREAM_BRANCH" \
                     UPSTREAM_EVENTS="$UPSTREAM_EVENTS" REQUIRED_WORKFLOWS="$UPSTREAM_WORKFLOWS" \
                     bash .github/scripts/green-commit.sh)
          fi
          full_hash "$commit" || { echo "::error::not a full commit hash: '$commit'"; exit 1; }

          # the release number the commit declares: what sail_riscv_sim --version prints, and what ACT4 compares
          version=$(curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM_REPO/$commit/cmake/project_version.cmake" \
                    | sed -n 's/^set(sail_riscv_release_version *"\([0-9.]*\)").*/\1/p')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::could not read the release number declared by $commit: '$version'"
            exit 1
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

          if [ "$INPUT_FORCE" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$commit already exists; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building Sail $version at $commit."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/base-sail
      dockerfile: docker/base/sail/Dockerfile
      title: Sail RISC-V
      description: The Sail RISC-V model (sail_riscv_sim) built from one commit. Only the install directory, /opt/riscv-foundation/sail.
      timeout-minutes: 90
      build-args: |
        SAIL_VERSION=${{ needs.pin.outputs.version }}
        SAIL_COMMIT=${{ needs.pin.outputs.commit }}
      labels: |
        sail-riscv.version=${{ needs.pin.outputs.version }}
        sail-riscv.commit=${{ needs.pin.outputs.commit }}
      tags: |
        ${{ needs.pin.outputs.commit }}
        latest
