name: Picolibc image

# Builds picolibc and the C++ libraries (libsupc++ and libstdc++) for the RISC-V GCC of the GCC image
# (every variant of that GCC), alone, once for each width: base-picolibc has the RV32 variants and
# base-picolibc-rv64 the RV64 ones. Each is published for linux/amd64 and linux/arm64, tagged with
# the picolibc commit and the commit of the GCC it was compiled with, and as latest.
#
# picolibc is compiled by the cross compiler, so it is built with the GCC of the latest GCC image.
# The GCC image does not depend on this one, so a new GCC makes a new picolibc build and a new
# picolibc never makes a new GCC build.
#
# - Run by hand to update picolibc: it builds the commit given, or the commit of the latest release
#   tag of the series set in SERIES (1.x.y), with the GCC the latest GCC image holds, unless that
#   image already exists.
# - Runs every day (schedule) and when the GCC image workflow finishes: it takes the commit of the
#   latest release tag of the series set in SERIES and builds it only if the image for it and for
#   the latest GCC does not exist yet. The schedule waits for a GCC image run that is going.
#   A change of Dockerfile or of this workflow does not build by itself, so a recipe
#   change that is not a new version does not rebuild an image for nothing: the Recipe
#   changed workflow warns about it, and a run by hand with `force` rebuilds.
#
# The CI images workflow then assembles a new image.
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "picolibc commit to build (empty: the latest release tag of the series set in SERIES)"
        required: false
      force:
        description: "Rebuild and republish even if the image for that commit and GCC already exists"
        type: boolean
        default: false
  workflow_run:
    workflows: ["GCC image"]
    types: [completed]
    branches: [main]

concurrency:
  group: picolibc-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base-picolibc
  IMAGE_RV64: ghcr.io/${{ github.repository_owner }}/base-picolibc-rv64
  GCC_IMAGE: ghcr.io/${{ github.repository_owner }}/base-gcc
  UPSTREAM: https://github.com/picolibc/picolibc
  # the major version of picolibc the image follows (1.x.y: the minor and the patch move to the
  # latest release); a new major is chosen by editing this line
  SERIES: "1"

jobs:
  pin:
    # Only decides what to build: the published image, tagged by the two commits, is what a later
    # run checks to skip the build.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      gcc: ${{ steps.pin.outputs.gcc }}
      gcc_image: ${{ steps.pin.outputs.gcc_image }}
      gcc_variants: ${{ steps.pin.outputs.gcc_variants }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead, and a workflow_run follows a run that was already authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for a GCC image run that is going
        # picolibc is compiled with the latest GCC image. While one is being built a scheduled run
        # would use the old one, and the end of the GCC run triggers this workflow again with the
        # new one. A manual run never defers.
        id: defer
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          for status in queued in_progress; do
            count=$(gh run list -R "$REPO" --workflow gcc-image.yml --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
            pending=$((pending + count))
          done
          if [ "$pending" -gt 0 ]; then
            echo "::notice::a GCC image run is still going; its end triggers this workflow."
            echo "defer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the commits
        id: pin
        if: steps.defer.outputs.defer != 'true'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty' 2>/dev/null || true
          }
          # the commit of the latest stable release tag of the series SERIES (1.x.y), not of a
          # moving branch, and not of a newer series: moving to the next one is an edit of SERIES
          upstream_commit() {
            tag=$(git ls-remote --tags --refs "$UPSTREAM" "${SERIES}.*" | sed 's|.*refs/tags/||' \
                  | grep -E "^${SERIES}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
            if [ -z "$tag" ]; then
              echo "::error::no release tag of the series ${SERIES} in $UPSTREAM" >&2
              return 1
            fi
            # an annotated tag has a second line, peeled to the commit (^{}); a lightweight one is the commit
            git ls-remote "$UPSTREAM" "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n 1 | cut -f1
          }

          # the GCC that compiles it: the latest GCC image, by the tag that holds its commit
          gcc=$(label "$GCC_IMAGE:latest" riscv-gnu-toolchain.commit)
          if [ -z "$gcc" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the commit of the latest GCC image; run the GCC image workflow first"
              exit 1
            fi
            echo "::notice::the GCC image is not published yet; its run triggers this workflow when it finishes."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gcc_image="$GCC_IMAGE:$gcc"
          # the number of library variants of that GCC (empty for an image published before it was recorded)
          gcc_variants=$(label "$GCC_IMAGE:latest" riscv-gnu-toolchain.variants)
          {
            echo "gcc=$gcc"
            echo "gcc_image=$gcc_image"
            echo "gcc_variants=$gcc_variants"
          } >> "$GITHUB_OUTPUT"

          force="$INPUT_FORCE"
          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ]; then
            commit=$(upstream_commit)
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          # The tag has the two commits only, so a GCC rebuilt with the same commit and another number
          # of variants would find the image of this tag and build nothing. The image records the
          # number of variants of the GCC it was compiled with, and a different one rebuilds it.
          # Both widths are checked, and either one missing builds both.
          published_variants=$(label "$IMAGE:$commit-$gcc" riscv-gnu-toolchain.variants)
          published_variants_rv64=$(label "$IMAGE_RV64:$commit-$gcc" riscv-gnu-toolchain.variants)
          if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit-$gcc" > /dev/null 2>&1 \
             && docker buildx imagetools inspect "$IMAGE_RV64:$commit-$gcc" > /dev/null 2>&1 \
             && [ "$published_variants" = "$gcc_variants" ] && [ "$published_variants_rv64" = "$gcc_variants" ]; then
            echo "::notice::$IMAGE:$commit-$gcc already exists with ${gcc_variants:-an unrecorded number of} variants; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit-$gcc" > /dev/null 2>&1; then
              echo "::notice::$IMAGE:$commit-$gcc has ${published_variants:-an unrecorded number of} variants and the GCC has ${gcc_variants:-an unrecorded number of}; rebuilding."
            fi
            echo "Building picolibc $commit with the GCC $gcc."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-picolibc
            width: 32
            title: picolibc for the RISC-V GCC
            description: picolibc and libstdc++, the C and C++ libraries of the RISC-V GCC for the RV32 variants (every combination of I or E, multiply none, Zmmul or M, F and D (D only with I), A, C and B (Zba, Zbb and Zbs), with the ABIs each allows, 192 variants). Only the files they install into the sysroot of that GCC, under /opt/riscv-foundation/riscv32-elf.
          - name: base-picolibc-rv64
            width: 64
            title: picolibc for the RISC-V GCC, RV64
            description: picolibc and libstdc++, the C and C++ libraries of the RISC-V GCC for the RV64 variants (every combination of I or E, multiply none, Zmmul or M, F and D (D only with I), A, C and B (Zba, Zbb and Zbs), with the ABIs each allows, 192 variants). Only the files they install into the sysroot of that GCC, under /opt/riscv-foundation/riscv32-elf.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      dockerfile: docker/base/picolibc/Dockerfile
      title: ${{ matrix.title }}
      description: ${{ matrix.description }}
      # picolibc and libstdc++ of 192 variants of one width: about 2.5 to 3.5 hours on 4 CPUs, in batches
      timeout-minutes: 360
      build-args: |
        WIDTH=${{ matrix.width }}
        GCC_IMAGE=${{ needs.pin.outputs.gcc_image }}
        PICOLIBC_COMMIT=${{ needs.pin.outputs.commit }}
        GCC_COMMIT=${{ needs.pin.outputs.gcc }}
      labels: |
        picolibc.commit=${{ needs.pin.outputs.commit }}
        riscv-gnu-toolchain.commit=${{ needs.pin.outputs.gcc }}
        riscv-gnu-toolchain.variants=${{ needs.pin.outputs.gcc_variants }}
      tags: |
        ${{ needs.pin.outputs.commit }}-${{ needs.pin.outputs.gcc }}
        latest
