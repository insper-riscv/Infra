name: Dev tools image

# Builds level 4 of the images, the final one (Dockerfile.devtools: the ELF image, that is every level
# below it, plus GTKWave, the user dev and the build tools; Python comes from the VHDL image) for linux/amd64 and linux/arm64 and
# publishes it as dev_tools, tagged latest and with the Infra commit. It runs when the ELF
# image or the GTKWave image workflow finishes (a new ELF image or a new GTKWave means a new
# image; both run every day, so the image follows the latest of the two), and on demand. A change of Dockerfile.devtools or of this workflow does not
# build by itself: the Recipe changed workflow warns about it, and a run by hand rebuilds.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
  workflow_run:
    workflows: ["ELF image", "GTKWave image"]
    types: [completed]
    branches: [main]

concurrency:
  group: devtools-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dev_tools
  ELF_IMAGE: ghcr.io/${{ github.repository_owner }}/ci-elf
  GTKWAVE_IMAGE: ghcr.io/${{ github.repository_owner }}/base-gtkwave

jobs:
  pin:
    # Only decides whether there is anything to assemble now, and which GTKWave goes in.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      gtkwave: ${{ steps.pins.outputs.gtkwave }}
      elf: ${{ steps.pins.outputs.elf }}
      short: ${{ steps.pins.outputs.short }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates who can trigger this,
        # but on a repo shared with people who shouldn't publish the image, this adds a second
        # check: only someone who separately knows IMAGE_PUBLISH_SECRET can run it. A workflow_run
        # skips this: branch protection on main is the gate for that path instead, and a
        # workflow_run follows a run that was already authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the ELF image digest and the GTKWave commit from the latest images
        id: pins
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # The images are manifests of two architectures that carry the same commits.
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty' 2>/dev/null || true
          }
          gtkwave=$(label "$GTKWAVE_IMAGE:latest" gtkwave.commit)
          elf=$(docker buildx imagetools inspect "$ELF_IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$gtkwave" ] || [ -z "$elf" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the latest GTKWave and ELF images; run the GTKWave image and ELF image workflows first"
              exit 1
            fi
            # A run can start before the images exist; their runs trigger this one when they finish.
            echo "::notice::the GTKWave and ELF images are not both published yet; their runs trigger this workflow when they finish."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The combination names the ELF image itself (the start of its digest): it carries every
          # lower level, so any of them changing is a new combination.
          elf_short=$(printf '%s' "$elf" | sed 's/^sha256://' | cut -c1-12)
          {
            echo "gtkwave=$gtkwave"
            echo "elf=$elf"
            echo "short=elf-${elf_short}-gtkwave-${gtkwave:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether there is anything to assemble now
        # Nothing to do when an image is not published yet, when a GTKWave or ELF image run is
        # still queued or going (its end triggers this workflow again, so the last one to finish
        # does the single assembly), or when a component workflow that found its image already
        # published (it still ends successfully) triggered this run for a
        # combination that exists. A manual run never defers and always builds.
        id: skip
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.pins.outputs.missing }}
          COMBINATION: ${{ steps.pins.outputs.short }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          if [ "$EVENT" != "workflow_dispatch" ]; then
            for workflow in gtkwave-image.yml elf-image.yml; do
              for status in queued in_progress; do
                # A workflow GitHub does not know yet makes this fail; count it as none.
                count=$(gh run list -R "$REPO" --workflow "$workflow" --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
                pending=$((pending + count))
              done
            done
          fi

          if [ "$MISSING" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "::notice::a GTKWave image or ELF image run is still going; it triggers this workflow when it finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "workflow_dispatch" ] && docker buildx imagetools inspect "$IMAGE:$COMBINATION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$COMBINATION already exists; nothing to assemble."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/dev_tools
      dockerfile: Dockerfile.devtools
      title: Insper RISC-V dev tools
      description: Every level of the images (VHDL, ASM, ELF) plus GTKWave, the build tools and the user dev, for a Dev Container.
      timeout-minutes: 60
      build-args: |
        ELF_IMAGE=ghcr.io/${{ github.repository_owner }}/ci-elf@${{ needs.pin.outputs.elf }}
        GTKWAVE_IMAGE=ghcr.io/${{ github.repository_owner }}/base-gtkwave:${{ needs.pin.outputs.gtkwave }}
      labels: |
        gtkwave.commit=${{ needs.pin.outputs.gtkwave }}
      tags: |
        latest
        sha-${{ github.sha }}
        ${{ needs.pin.outputs.short }}
      check: |
        test "$(id -un)" = dev
        test "$(pwd)" = /work
        ghdl --version | head -n 1
        sail_riscv_sim --version
        ruby --version
        riscv32-unknown-elf-gcc --version | head -n 1
        uv --version
        python3 -c "import cocotb, sys; assert sys.version_info[:2] == (3, 14); print(cocotb.__version__)"
        ! ldd /opt/gtkwave/bin/gtkwave | grep "not found"
        test -x /opt/gtkwave/bin/gtkwave
        echo "int main(void){return 0;}" > /tmp/t.c && gcc /tmp/t.c -o /tmp/t && /tmp/t
