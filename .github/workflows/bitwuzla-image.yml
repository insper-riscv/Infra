name: Bitwuzla image

# Builds Bitwuzla from source, alone, and publishes it as base-bitwuzla for linux/amd64 and
# linux/arm64, tagged with the commit and as latest.
#
# - Run by hand to update it: it builds the commit given, or the commit of the latest release tag of
#   the series set in SERIES, unless that image already exists.
# - Runs every day (schedule): it takes the commit of the latest release tag of the series set in
#   SERIES and builds it only if that image does not exist yet.
#   A change of Dockerfile or of this workflow does not build by itself, so a recipe
#   change that is not a new version does not rebuild an image for nothing: the Recipe
#   changed workflow warns about it, and a run by hand with `force` rebuilds.
#
# The CI images workflow then assembles a new image.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "bitwuzla commit to build (empty: the latest release tag of the series set in SERIES)"
        required: false
      force:
        description: "Rebuild and republish even if the image for that commit already exists"
        type: boolean
        default: false

concurrency:
  group: bitwuzla-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base-bitwuzla
  UPSTREAM: https://github.com/bitwuzla/bitwuzla
  # the major version the image follows (0.N.P: the minor and the patch move to the latest
  # release); a new major is chosen by editing this line
  SERIES: "0"

jobs:
  pin:
    # Only decides what to build: the published image, tagged by commit, is what a later run
    # checks to skip the build.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      version: ${{ steps.pin.outputs.version }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the commit
        id: pin
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          # the commit a tag points at: an annotated tag has a second line, peeled to the commit
          # (^{}); a lightweight one is the commit
          tag_commit() {
            git ls-remote "$UPSTREAM" "refs/tags/$1" "refs/tags/$1^{}" | tail -n 1 | cut -f1
          }
          # the latest stable release tag of the series SERIES (0.N.P), not of a moving
          # branch, and not of a newer series: moving to the next one is an edit of SERIES
          latest_tag() {
            git ls-remote --tags --refs "$UPSTREAM" "${SERIES}.*" | sed 's|.*refs/tags/||' \
              | grep -E "^${SERIES}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1
          }

          force="$INPUT_FORCE"
          commit="${INPUT_COMMIT:-}"
          tag=""
          if [ -z "$commit" ]; then
            tag=$(latest_tag)
            if [ -z "$tag" ]; then
              echo "::error::no release tag of the series ${SERIES} in $UPSTREAM"
              exit 1
            fi
            commit=$(tag_commit "$tag")
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: '$commit' (is there a $tag tag in $UPSTREAM?)"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # the version of the release whose tag points at the commit (empty for a commit that is not a release),
          # which the image writes in its .tag
          . .github/scripts/name-of.sh
          echo "version=$(version_of "$UPSTREAM" "$commit")" >> "$GITHUB_OUTPUT"

          if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$commit already exists; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building bitwuzla $commit${tag:+ ($tag)}."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/base-bitwuzla
      dockerfile: docker/base/bitwuzla/Dockerfile
      title: Bitwuzla
      description: Bitwuzla, the SMT solver SymbiYosys runs as smtbmc bitwuzla, built from source. Only the install directory, /opt/bitwuzla.
      timeout-minutes: 60
      build-args: |
        BITWUZLA_COMMIT=${{ needs.pin.outputs.commit }}
        BITWUZLA_VERSION=${{ needs.pin.outputs.version }}
      labels: |
        bitwuzla.commit=${{ needs.pin.outputs.commit }}
        bitwuzla.version=${{ needs.pin.outputs.version }}
      tags: |
        ${{ needs.pin.outputs.commit }}
        latest
