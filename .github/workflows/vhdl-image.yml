name: VHDL image

# Assembles level 1 of the images (GHDL, Yosys with SymbiYosys, and uv, with Python and cocotb: what
# a VHDL test needs) for linux/amd64 and linux/arm64 from the latest base-ghdl and base-yosys
# images, which the GHDL image and Yosys image workflows publish. It runs when one of them
# finishes, every day at 03:00 UTC (the `uv` has no component image, so it is looked up here),
# and on demand. A change of Dockerfile.vhdl-img or of this workflow does not assemble by
# itself: the Recipe changed workflow warns about it, and a run by hand rebuilds. The ASM image
# workflow builds on the image this one publishes.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      uv_version:
        description: "uv version to put in the image (empty: the latest stable release of the series set in UV_SERIES)"
        required: false
  workflow_run:
    workflows: ["GHDL image", "Yosys image"]
    types: [completed]
    branches: [main]

concurrency:
  group: vhdl-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ci-vhdl
  # the major version of uv the image follows (0.x.y: the minor and the patch move to the latest
  # release); a new major is chosen by editing this line
  UV_SERIES: "0"
  GHDL_IMAGE: ghcr.io/${{ github.repository_owner }}/base-ghdl
  YOSYS_IMAGE: ghcr.io/${{ github.repository_owner }}/base-yosys

jobs:
  pin:
    # Only decides whether there is anything to assemble now, and which components go in.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      ghdl: ${{ steps.pins.outputs.ghdl }}
      yosys: ${{ steps.pins.outputs.yosys }}
      sby: ${{ steps.pins.outputs.sby }}
      uv: ${{ steps.uv.outputs.version }}
      short: ${{ steps.pins.outputs.short }}
      python: ${{ steps.python.outputs.python }}
      cocotb: ${{ steps.python.outputs.cocotb }}
      click: ${{ steps.python.outputs.click }}
      full: ${{ steps.pins.outputs.full }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead, and a workflow_run follows a run that was
        # already authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the uv version
        # Every run takes the version given (a manual run), or the latest stable release of the
        # series set in UV_SERIES. The version is in the tag of the combination, so a run for a
        # version that is already published assembles nothing; and a new uv is picked up by the
        # first run after it is released, whether that is the schedule or the end of a component.
        id: uv
        env:
          INPUT_UV: ${{ inputs.uv_version }}
        run: |
          version="${INPUT_UV:-}"
          if [ -z "$version" ]; then
            version=$(git ls-remote --tags --refs https://github.com/astral-sh/uv "${UV_SERIES}.*" \
                      | sed 's|.*refs/tags/||' | grep -E "^${UV_SERIES}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          fi
          if [ -z "$version" ]; then
            echo "::error::no release of the uv series ${UV_SERIES}"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a uv version: $version"
            exit 1
          fi
          if ! curl -fsSIL -o /dev/null "https://astral.sh/uv/$version/install.sh"; then
            echo "::error::the installer of uv $version is not published"
            exit 1
          fi
          echo "uv $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve the Python patch and read the fixed versions
        # The Python of the image is the latest patch of the series in Dockerfile.vhdl-img that this
        # uv knows, so a new uv brings a new patch with it; cocotb and click are the versions
        # Dockerfile.vhdl-img fixes. They go in the tags and labels of the image, and not in the
        # combination that decides whether to build: a new uv is what makes a new image.
        # The same installer the image uses puts that uv on the runner to list the Pythons.
        id: python
        env:
          UV: ${{ steps.uv.outputs.version }}
        run: |
          series=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile.vhdl-img)
          cocotb=$(sed -n 's/^ARG COCOTB_VERSION=//p' Dockerfile.vhdl-img)
          click=$(sed -n 's/^ARG CLICK_VERSION=//p' Dockerfile.vhdl-img)
          printf '%s' "$series" | grep -Eq '^[0-9]+\.[0-9]+$' || { echo "::error::no Python series in Dockerfile.vhdl-img: '$series'"; exit 1; }
          for v in "$cocotb" "$click"; do
            printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a version in Dockerfile.vhdl-img: '$v'"; exit 1; }
          done
          curl -fsSL "https://astral.sh/uv/$UV/install.sh" -o "$RUNNER_TEMP/uv-install.sh"
          UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh "$RUNNER_TEMP/uv-install.sh" > /dev/null
          python=$("$RUNNER_TEMP/uv-bin/uv" python list "$series" --only-downloads --output-format json \
                   | jq -r '[.[].version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty')
          if [ -z "$python" ]; then
            echo "::error::uv $UV knows no Python $series"
            exit 1
          fi
          echo "python $python, cocotb $cocotb, click $click"
          {
            echo "python=$python"
            echo "cocotb=$cocotb"
            echo "click=$click"
          } >> "$GITHUB_OUTPUT"

      - name: Read the component commits from the latest images
        id: pins
        env:
          EVENT: ${{ github.event_name }}
          UV: ${{ steps.uv.outputs.version }}
          PYTHON: ${{ steps.python.outputs.python }}
          COCOTB: ${{ steps.python.outputs.cocotb }}
          CLICK: ${{ steps.python.outputs.click }}
        run: |
          # The component images are manifests of two architectures that carry the same commit.
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty'
          }
          ghdl=$(label "$GHDL_IMAGE:latest" ghdl.commit)
          yosys=$(label "$YOSYS_IMAGE:latest" yosys.commit)
          sby=$(label "$YOSYS_IMAGE:latest" sby.commit)
          if [ -z "$ghdl" ] || [ -z "$yosys" ] || [ -z "$sby" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the commits from the latest GHDL and Yosys images; run the GHDL image and Yosys image workflows first"
              exit 1
            fi
            # A run can start before the components exist (the merge that
            # adds them also changes this workflow); their runs trigger this
            # one when they finish.
            echo "::notice::the GHDL and Yosys images are not both published yet; their runs trigger this workflow when they finish."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ghdl=$ghdl" >> "$GITHUB_OUTPUT"
          echo "yosys=$yosys" >> "$GITHUB_OUTPUT"
          echo "sby=$sby" >> "$GITHUB_OUTPUT"
          # short names what decides whether to build; full adds the versions that follow from the uv
          short="ghdl-${ghdl:0:7}-yosys-${yosys:0:7}-sby-${sby:0:7}-uv-${UV}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "full=$short-python-${PYTHON}-cocotb-${COCOTB}-click-${CLICK}" >> "$GITHUB_OUTPUT"

      - name: Decide whether there is anything to assemble now
        # Nothing to do when a component is not published yet, when a component run is still queued
        # or going (its end triggers this workflow again, so the last one to finish does the single
        # assembly), or when this run (scheduled, or triggered by a component workflow that found
        # its image already published and still ended successfully) is for a combination that
        # exists. A manual run never defers and always builds.
        id: skip
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.pins.outputs.missing }}
          COMBINATION: ${{ steps.pins.outputs.short }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          if [ "$EVENT" != "workflow_dispatch" ]; then
            for workflow in ghdl-image.yml yosys-image.yml; do
              for status in queued in_progress; do
                # A workflow GitHub does not know yet (the merge that adds
                # them together) makes this fail; count it as none.
                count=$(gh run list -R "$REPO" --workflow "$workflow" --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
                pending=$((pending + count))
              done
            done
          fi

          if [ "$MISSING" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "::notice::a GHDL or Yosys image run is still going; it triggers this workflow when it finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "workflow_dispatch" ] && docker buildx imagetools inspect "$IMAGE:$COMBINATION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$COMBINATION already exists; nothing to assemble."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each assembled on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/ci-vhdl
      dockerfile: Dockerfile.vhdl-img
      title: Insper RISC-V VHDL tests
      description: GHDL, Yosys with SymbiYosys, uv, Python and cocotb, for linux/amd64 and linux/arm64.
      timeout-minutes: 60
      build-args: |
        GHDL_IMAGE=ghcr.io/${{ github.repository_owner }}/base-ghdl:${{ needs.pin.outputs.ghdl }}
        UV_VERSION=${{ needs.pin.outputs.uv }}
        PYTHON_VERSION=${{ needs.pin.outputs.python }}
        COCOTB_VERSION=${{ needs.pin.outputs.cocotb }}
        CLICK_VERSION=${{ needs.pin.outputs.click }}
        YOSYS_IMAGE=ghcr.io/${{ github.repository_owner }}/base-yosys:${{ needs.pin.outputs.yosys }}-${{ needs.pin.outputs.sby }}
      labels: |
        uv.version=${{ needs.pin.outputs.uv }}
        python.version=${{ needs.pin.outputs.python }}
        cocotb.version=${{ needs.pin.outputs.cocotb }}
        click.version=${{ needs.pin.outputs.click }}
        ghdl.commit=${{ needs.pin.outputs.ghdl }}
        yosys.commit=${{ needs.pin.outputs.yosys }}
        sby.commit=${{ needs.pin.outputs.sby }}
      tags: |
        latest
        sha-${{ github.sha }}
        ${{ needs.pin.outputs.short }}
        ${{ needs.pin.outputs.full }}
      check: |
        # what is inside the image is what the workflow pinned: the commit each component left in its
        # install directory against the commit the labels and tags of this image say
        expect() { if [ "$2" = "$3" ]; then echo "ok    $1 $3"; else echo "WRONG $1: expected $2, found $3"; exit 1; fi; }
        expect ghdl     "${{ needs.pin.outputs.ghdl }}"                 "$(cat /opt/ghdl/.tag)"
        expect yosys    "${{ needs.pin.outputs.yosys }}"                "$(cat /opt/yosys/.tag)"
        expect sby      "${{ needs.pin.outputs.sby }}"                  "$(cat /opt/yosys/.sby.tag)"
        expect uv       "${{ needs.pin.outputs.uv }}"                   "$(uv --version | cut -d' ' -f2)"
        expect python   "${{ needs.pin.outputs.python }}"               "$(python3 -c 'import platform; print(platform.python_version())')"
        expect cocotb   "${{ needs.pin.outputs.cocotb }}"               "$(python3 -c 'import cocotb; print(cocotb.__version__)')"
        expect click    "${{ needs.pin.outputs.click }}"                "$(python3 -c 'import importlib.metadata as m; print(m.version("click"))')"
        ghdl --version | head -n 1
        yosys -V | head -n 1
        sby --version
        uv --version
        python3 -c "import cocotb, sys; assert sys.version_info[:2] == (3, 14); print(cocotb.__version__)"
