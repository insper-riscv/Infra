name: GTKWave image

# Builds GTKWave (the 3.3 maintenance branch, GTK 3 tree) alone and publishes it as
# base-gtkwave, tagged with the gtkwave/gtkwave commit and as latest, for linux/amd64 and linux/arm64.
#
# - Run by hand to update GTKWave: it builds the commit given, or the head of the upstream's
#   maintenance branch of the 3.3 line (BRANCH), unless that image already exists. The upstream has
#   tagged no release since v3.3.116 (2023), while the branch keeps getting fixes, security ones
#   included, so the branch is what the image follows.
# - Runs every day (schedule): it takes the head of BRANCH and builds it only if that image does
#   not exist yet.
#   A change of Dockerfile or of this workflow does not build by itself, so a recipe
#   change that is not a new version does not rebuild an image for nothing: the Recipe
#   changed workflow warns about it, and a run by hand with `force` rebuilds.
#
# The Dev tools image workflow then assembles a new image.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "gtkwave commit to build (empty: the head of the lts branch)"
        required: false
      force:
        description: "Rebuild and republish even if the image for that commit already exists"
        type: boolean
        default: false

concurrency:
  group: gtkwave-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base-gtkwave
  UPSTREAM: https://github.com/gtkwave/gtkwave
  LABEL: gtkwave.commit
  # the upstream branch the image follows: the maintenance line of GTKWave 3.3 (master is the 4.0
  # pre-alpha); a different line is chosen by editing this line
  BRANCH: lts

jobs:
  pin:
    # Only decides what to build: the published image, tagged by commit, is what a later run
    # checks to skip the build.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the commit
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          upstream_commit() {
            # the head of the branch BRANCH, not of a release tag: there is no tag after v3.3.116
            git ls-remote "$UPSTREAM" "refs/heads/${BRANCH}" | cut -f1
          }

          force="$INPUT_FORCE"
          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ]; then
            commit=$(upstream_commit)
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$commit already exists; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $commit."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/base-gtkwave
      dockerfile: docker/base/gtkwave/Dockerfile
      title: GTKWave (GTK 3)
      description: GTKWave, the waveform viewer, GTK 3 tree of the 3.3 maintenance branch (lts). Only the install directory, /opt/gtkwave.
      timeout-minutes: 150
      build-args: GTKWAVE_COMMIT=${{ needs.pin.outputs.commit }}
      labels: gtkwave.commit=${{ needs.pin.outputs.commit }}
      tags: |
        ${{ needs.pin.outputs.commit }}
        latest
