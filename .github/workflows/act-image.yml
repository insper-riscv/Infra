name: ACT image

# Builds the environment to run the ACT4 (riscv-arch-test) suite (Dockerfile.act: the dev tools
# image plus Sail, Ruby, Bundler, and the gems and Python packages of the commit of ACT4 set in
# ACT4_COMMIT) for linux/amd64 and linux/arm64 and publishes it as act_tools, tagged latest and
# with the Infra commit. It runs when the Dev tools image or the Sail image workflow finishes (a
# new dev tools or a new Sail means a new image), every day at 04:30 UTC (after both are looked
# up, as a check that the image follows the latest of the two), and on demand. A change of
# Dockerfile.act or of this workflow does not build by itself: the Recipe changed workflow warns
# about it, and a run by hand rebuilds.
#
# The commit of ACT4 is not looked up: it is the one the projects pin as a submodule, and it
# changes on purpose, by editing ACT4_COMMIT here.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      act4_commit:
        description: "riscv/riscv-arch-test commit whose dependencies go in the image (empty: ACT4_COMMIT of this workflow)"
        required: false
  workflow_run:
    workflows: ["Dev tools image", "Sail image"]
    types: [completed]
    branches: [main]

concurrency:
  group: act-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/act_tools
  DEVTOOLS_IMAGE: ghcr.io/${{ github.repository_owner }}/dev_tools
  SAIL_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-sail
  # the commit of riscv/riscv-arch-test the projects pin; update it together with their submodule
  ACT4_COMMIT: 736d8ee1d64442449f3aa2c11cc93467cb66a4af

jobs:
  pin:
    # Only decides whether there is anything to assemble now, and which Sail and dev tools go in.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      devtools: ${{ steps.pins.outputs.devtools }}
      sail: ${{ steps.pins.outputs.sail }}
      act4: ${{ steps.pins.outputs.act4 }}
      short: ${{ steps.pins.outputs.short }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates who can trigger this,
        # but on a repo shared with people who shouldn't publish the image, this adds a second
        # check: only someone who separately knows IMAGE_PUBLISH_SECRET can run it. A workflow_run
        # skips this: branch protection on main is the gate for that path instead, and a
        # workflow_run follows a run that was already authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the dev tools and Sail pins from the latest images
        id: pins
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ACT4: ${{ inputs.act4_commit }}
        run: |
          # The images are manifests of two architectures that carry the same commits.
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty' 2>/dev/null || true
          }
          sail=$(label "$SAIL_IMAGE:latest" sail-riscv.commit)
          devtools=$(docker buildx imagetools inspect "$DEVTOOLS_IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          act4="${INPUT_ACT4:-$ACT4_COMMIT}"
          if ! printf '%s' "$act4" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $act4"
            exit 1
          fi
          if [ -z "$sail" ] || [ -z "$devtools" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the latest Sail and dev tools images; run the Sail image and Dev tools image workflows first"
              exit 1
            fi
            # A run can start before the images exist; their runs trigger this one when they finish.
            echo "::notice::the Sail and dev tools images are not both published yet; their runs trigger this workflow when they finish."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          devtools_short=$(printf '%s' "$devtools" | sed 's/^sha256://' | cut -c1-12)
          {
            echo "devtools=$devtools"
            echo "sail=$sail"
            echo "act4=$act4"
            echo "short=devtools-${devtools_short}-sail-${sail:0:7}-act4-${act4:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether there is anything to assemble now
        # Nothing to do when an image is not published yet, when a dev tools or Sail run is still
        # queued or going (its end triggers this workflow again, so the last one to finish does the
        # single assembly), or when a component workflow that found its image already published
        # (it still ends successfully) triggered this run, or the schedule did, for a combination
        # that exists. A manual run never defers and always builds.
        id: skip
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.pins.outputs.missing }}
          COMBINATION: ${{ steps.pins.outputs.short }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          if [ "$EVENT" != "workflow_dispatch" ]; then
            for workflow in devtools-image.yml sail-image.yml; do
              for status in queued in_progress; do
                # A workflow GitHub does not know yet makes this fail; count it as none.
                count=$(gh run list -R "$REPO" --workflow "$workflow" --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
                pending=$((pending + count))
              done
            done
          fi

          if [ "$MISSING" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "::notice::a Dev tools image or Sail image run is still going; it triggers this workflow when it finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "workflow_dispatch" ] && docker buildx imagetools inspect "$IMAGE:$COMBINATION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$COMBINATION already exists; nothing to assemble."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/act_tools
      dockerfile: Dockerfile.act
      title: Insper RISC-V ACT tools
      description: The dev tools image plus Sail, Ruby, Bundler and the dependencies of ACT4, to run the riscv-arch-test suite.
      timeout-minutes: 60
      build-args: |
        DEVTOOLS_IMAGE=ghcr.io/${{ github.repository_owner }}/dev_tools@${{ needs.pin.outputs.devtools }}
        SAIL_IMAGE=ghcr.io/${{ github.repository_owner }}/infra-sail:${{ needs.pin.outputs.sail }}
        ACT4_COMMIT=${{ needs.pin.outputs.act4 }}
      labels: |
        act4.commit=${{ needs.pin.outputs.act4 }}
        sail-riscv.commit=${{ needs.pin.outputs.sail }}
      tags: |
        latest
        sha-${{ github.sha }}
        ${{ needs.pin.outputs.short }}
      check: |
        test "$(id -un)" = dev
        test "$(pwd)" = /work
        ruby --version
        bundle --version
        sail_riscv_sim --version
        ! ldd /opt/sail/bin/sail_riscv_sim | grep "not found"
        ghdl --version | head -n 1
        riscv32-unknown-elf-gcc --version | head -n 1
        uv --version
