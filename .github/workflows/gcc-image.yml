name: GCC image

# Builds the RISC-V GCC (rv32im/ilp32, picolibc) alone and publishes it as
# infra-gcc, tagged with the riscv-gnu-toolchain commit and the picolibc commit it was built
# against, and as latest.
#
# The build starts from the compiled picolibc of the latest picolibc image and runs only the
# second stage of riscv-gnu-toolchain (the first compiler, about half of the build, is skipped),
# so the libgcc and libstdc++ it makes are built against that picolibc.
#
# - Run by hand to update the GCC: it builds the commit given, or the latest of
#   the upstream default branch, unless that image already exists.
# - Runs every day (schedule): it takes the head of the upstream default branch and builds it
#   against the latest picolibc only if that image does not exist yet.
#   A change of Dockerfile or of this workflow does not build by itself, so a recipe
#   change that is not a new version does not rebuild an image for nothing: the Recipe
#   changed workflow warns about it, and a run by hand with `force` rebuilds.
# - Runs when the Picolibc image workflow finishes: a new picolibc gets a new build of the GCC
#   latest already holds, from the second stage. When the picolibc is the one the GCC image
#   already has, it builds nothing.
#
# The Toolchain image workflow then assembles a new complete image.
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "riscv-gnu-toolchain commit to build (empty: the latest of its default branch)"
        required: false
      force:
        description: "Rebuild and republish even if the image for that commit and picolibc already exists"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Picolibc image"]
    types: [completed]
    branches: [main]

concurrency:
  group: gcc-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/infra-gcc
  PICOLIBC_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-picolibc
  UPSTREAM: https://github.com/riscv-collab/riscv-gnu-toolchain
  LABEL: riscv-gnu-toolchain.commit

jobs:
  pin:
    # Compiles the GCC, which takes most of an hour on a hosted runner. No layer
    # cache: the published image, tagged by commit, is what a later run
    # checks to skip the build.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      picolibc: ${{ steps.pin.outputs.picolibc }}
      picolibc_image: ${{ steps.pin.outputs.picolibc_image }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead, and a workflow_run follows a run that was already
        # authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1
        with:
          # BuildKit clips each step's log at 2 MiB, which is well before the
          # end of the GCC build; -1 lifts the limit so the log shows it all.
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for a Picolibc image run that is going
        # The GCC is built against the latest picolibc image. While one is being built a scheduled
        # run would build against the old one, and the end of the picolibc run triggers this
        # workflow again with the new one. A manual run never defers.
        id: defer
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          for status in queued in_progress; do
            count=$(gh run list -R "$REPO" --workflow picolibc-image.yml --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
            pending=$((pending + count))
          done
          if [ "$pending" -gt 0 ]; then
            echo "::notice::a Picolibc image run is still going; its end triggers this workflow."
            echo "defer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the commits
        id: pin
        if: steps.defer.outputs.defer != 'true'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty' 2>/dev/null || true
          }
          upstream_commit() {
            git ls-remote "$UPSTREAM" HEAD | cut -f1
          }

          # The picolibc the build starts from: the latest picolibc image, by the tag that holds its
          # picolibc commit and the GCC it was compiled with.
          picolibc=$(label "$PICOLIBC_IMAGE:latest" picolibc.commit)
          picolibc_gcc=$(label "$PICOLIBC_IMAGE:latest" riscv-gnu-toolchain.commit)
          if [ -z "$picolibc" ] || [ -z "$picolibc_gcc" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the latest picolibc image; run the Picolibc image workflow first"
              exit 1
            fi
            echo "::notice::the picolibc image is not published yet; its run triggers this workflow when it finishes."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "picolibc=$picolibc" >> "$GITHUB_OUTPUT"
          echo "picolibc_image=$PICOLIBC_IMAGE:$picolibc-$picolibc_gcc" >> "$GITHUB_OUTPUT"

          force="$INPUT_FORCE"
          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ] && [ "$EVENT" = "workflow_run" ]; then
            # There is a new picolibc: build the GCC latest already holds against it, from the
            # second stage.
            commit=$(label "$IMAGE:latest" "$LABEL")
          fi
          if [ -z "$commit" ]; then
            commit=$(upstream_commit)
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit-$picolibc" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$commit-$picolibc already exists; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $commit against the picolibc $picolibc."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/infra-gcc
      dockerfile: Dockerfile.gcc
      title: RISC-V GCC (rv32im, picolibc)
      description: The RISC-V GCC for rv32im and ilp32 with picolibc, built from source. Only the install directory, /opt/riscv-foundation/riscv32-elf.
      timeout-minutes: 360
      build-args: |
        RISCV_GNU_TOOLCHAIN_COMMIT=${{ needs.pin.outputs.commit }}
        PICOLIBC_COMMIT=${{ needs.pin.outputs.picolibc }}
        PICOLIBC_IMAGE=${{ needs.pin.outputs.picolibc_image }}
      labels: |
        riscv-gnu-toolchain.commit=${{ needs.pin.outputs.commit }}
        picolibc.commit=${{ needs.pin.outputs.picolibc }}
      tags: |
        ${{ needs.pin.outputs.commit }}-${{ needs.pin.outputs.picolibc }}
        latest
