name: ELF image

# Builds level 3 of the images (Dockerfile.elf-img: the ASM image plus Sail, Ruby, Bundler, and the
# gems and Python packages of the commit of ACT4 set in ACT4_COMMIT) for linux/amd64 and
# linux/arm64 and publishes it as ci-elf, tagged latest and with the Infra commit. It runs when
# the ASM image or the Sail image workflow finishes (a new ASM image or a new Sail means a new
# image; both run every day, so the image follows the latest of the two), and on demand. A change of Dockerfile.elf-img or of this workflow does not build
# by itself: the Recipe changed workflow warns about it, and a run by hand rebuilds. The dev tools
# image workflow builds on the image this one publishes.
#
# The commit of ACT4 is not looked up: it is the one the projects pin as a submodule, and it
# changes on purpose, by editing ACT4_COMMIT here.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      act4_commit:
        description: "riscv/riscv-arch-test commit whose dependencies go in the image (empty: ACT4_COMMIT of this workflow)"
        required: false
  workflow_run:
    workflows: ["ASM image", "Sail image"]
    types: [completed]
    branches: [main]

concurrency:
  group: elf-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ci-elf
  ASM_IMAGE: ghcr.io/${{ github.repository_owner }}/ci-asm
  SAIL_IMAGE: ghcr.io/${{ github.repository_owner }}/base-sail
  # the commit of riscv/riscv-arch-test the projects pin; update it together with their submodule
  ACT4_COMMIT: 736d8ee1d64442449f3aa2c11cc93467cb66a4af

jobs:
  pin:
    # Only decides whether there is anything to assemble now, and which Sail and ASM image go in.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      asm: ${{ steps.pins.outputs.asm }}
      sail: ${{ steps.pins.outputs.sail }}
      act4: ${{ steps.pins.outputs.act4 }}
      short: ${{ steps.pins.outputs.short }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates who can trigger this,
        # but on a repo shared with people who shouldn't publish the image, this adds a second
        # check: only someone who separately knows IMAGE_PUBLISH_SECRET can run it. A workflow_run
        # skips this: branch protection on main is the gate for that path instead, and a
        # workflow_run follows a run that was already authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the ASM image digest and the Sail pin from the latest images
        id: pins
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ACT4: ${{ inputs.act4_commit }}
        run: |
          # The images are manifests of two architectures that carry the same commits.
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty' 2>/dev/null || true
          }
          sail=$(label "$SAIL_IMAGE:latest" sail-riscv.commit)
          asm=$(docker buildx imagetools inspect "$ASM_IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          act4="${INPUT_ACT4:-$ACT4_COMMIT}"
          if ! printf '%s' "$act4" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $act4"
            exit 1
          fi
          if [ -z "$sail" ] || [ -z "$asm" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the latest Sail and ASM images; run the Sail image and ASM image workflows first"
              exit 1
            fi
            # A run can start before the images exist; their runs trigger this one when they finish.
            echo "::notice::the Sail and ASM images are not both published yet; their runs trigger this workflow when they finish."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          asm_short=$(printf '%s' "$asm" | sed 's/^sha256://' | cut -c1-12)
          {
            echo "asm=$asm"
            echo "sail=$sail"
            echo "act4=$act4"
            echo "short=asm-${asm_short}-sail-${sail:0:7}-act4-${act4:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether there is anything to assemble now
        # Nothing to do when an image is not published yet, when an ASM image or Sail run is still
        # queued or going (its end triggers this workflow again, so the last one to finish does the
        # single assembly), or when a component workflow that found its image already published
        # (it still ends successfully) triggered this run for a combination
        # that exists. A manual run never defers and always builds.
        id: skip
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.pins.outputs.missing }}
          COMBINATION: ${{ steps.pins.outputs.short }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          if [ "$EVENT" != "workflow_dispatch" ]; then
            for workflow in asm-image.yml sail-image.yml; do
              for status in queued in_progress; do
                # A workflow GitHub does not know yet makes this fail; count it as none.
                count=$(gh run list -R "$REPO" --workflow "$workflow" --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
                pending=$((pending + count))
              done
            done
          fi

          if [ "$MISSING" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "::notice::an ASM image or Sail image run is still going; it triggers this workflow when it finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "workflow_dispatch" ] && docker buildx imagetools inspect "$IMAGE:$COMBINATION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$COMBINATION already exists; nothing to assemble."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/ci-elf
      dockerfile: Dockerfile.elf-img
      title: Insper RISC-V ELF tests
      description: The ASM image plus Sail, Ruby, Bundler and the dependencies of ACT4, to run the riscv-arch-test suite.
      timeout-minutes: 60
      build-args: |
        ASM_IMAGE=ghcr.io/${{ github.repository_owner }}/ci-asm@${{ needs.pin.outputs.asm }}
        SAIL_IMAGE=ghcr.io/${{ github.repository_owner }}/base-sail:${{ needs.pin.outputs.sail }}
        ACT4_COMMIT=${{ needs.pin.outputs.act4 }}
      labels: |
        act4.commit=${{ needs.pin.outputs.act4 }}
        sail-riscv.commit=${{ needs.pin.outputs.sail }}
      tags: |
        latest
        sha-${{ github.sha }}
        ${{ needs.pin.outputs.short }}
      check: |
        ruby --version
        bundle --version
        sail_riscv_sim --version
        ! ldd /opt/riscv-foundation/sail/bin/sail_riscv_sim | grep "not found"
        ghdl --version | head -n 1
        riscv32-unknown-elf-gcc --version | head -n 1
        uv --version
