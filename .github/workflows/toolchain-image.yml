name: Toolchain image

# Assembles the complete image (GHDL, the RISC-V GCC with picolibc, Spike, Yosys with SymbiYosys,
# and uv) for linux/amd64 and linux/arm64 from the latest infra-ghdl, infra-gcc, infra-spike and
# infra-yosys images, which the GHDL image, GCC image, Spike image and Yosys image workflows
# publish. The picolibc is the one inside the GCC image: a new picolibc (Picolibc image) makes the
# GCC image build again, and this workflow assembles when that GCC image is the one built against
# the latest picolibc. It runs when one of them finishes, every day (the `uv` is the one component
# with no image of ours, so it is looked up here), and on demand. A change of Dockerfile or of this
# workflow does not assemble by itself: the Recipe changed workflow warns about it, and a run by
# hand rebuilds.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      uv_version:
        description: "uv version to put in the image (empty: the latest stable release of the series set in UV_SERIES)"
        required: false
  workflow_run:
    workflows: ["GHDL image", "GCC image", "Spike image", "Yosys image"]
    types: [completed]
    branches: [main]

concurrency:
  group: toolchain-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/infra-toolchain
  # the major version of uv the image follows (0.x.y: the minor and the patch move to the latest
  # release); a new major is chosen by editing this line
  UV_SERIES: "0"
  GHDL_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-ghdl
  GCC_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-gcc
  PICOLIBC_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-picolibc
  SPIKE_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-spike
  YOSYS_IMAGE: ghcr.io/${{ github.repository_owner }}/infra-yosys

jobs:
  pin:
    # Only decides whether there is anything to assemble now, and which components go in.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
      ghdl: ${{ steps.pins.outputs.ghdl }}
      gcc: ${{ steps.pins.outputs.gcc }}
      picolibc: ${{ steps.pins.outputs.picolibc }}
      spike: ${{ steps.pins.outputs.spike }}
      yosys: ${{ steps.pins.outputs.yosys }}
      sby: ${{ steps.pins.outputs.sby }}
      uv: ${{ steps.uv.outputs.version }}
      short: ${{ steps.pins.outputs.short }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead, and a workflow_run follows a run that was
        # already authorized.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the uv version
        # A manual run takes the version given, or the latest stable release of uv. The other runs
        # (a component that finished) keep the uv the latest image already has: the
        # version only moves when someone asks, the same way the commit of the GCC or Spike does.
        id: uv
        env:
          EVENT: ${{ github.event_name }}
          INPUT_UV: ${{ inputs.uv_version }}
        run: |
          version="${INPUT_UV:-}"
          if [ -z "$version" ] && [ "$EVENT" = "workflow_run" ]; then
            version=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '."linux/amd64".config.Labels["uv.version"] // empty' 2>/dev/null || true)
          fi
          if [ -z "$version" ]; then
            version=$(git ls-remote --tags --refs https://github.com/astral-sh/uv "${UV_SERIES}.*" \
                      | sed 's|.*refs/tags/||' | grep -E "^${UV_SERIES}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          fi
          if [ -z "$version" ]; then
            echo "::error::no release of the uv series ${UV_SERIES}"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a uv version: $version"
            exit 1
          fi
          if ! docker buildx imagetools inspect "ghcr.io/astral-sh/uv:$version" > /dev/null 2>&1; then
            echo "::error::ghcr.io/astral-sh/uv:$version does not exist"
            exit 1
          fi
          echo "uv $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read the component commits from the latest images
        id: pins
        env:
          EVENT: ${{ github.event_name }}
          UV: ${{ steps.uv.outputs.version }}
        run: |
          # The component images are manifests of two architectures that carry the same commit.
          label() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' \
              | jq -r --arg key "$2" '."linux/amd64".config.Labels[$key] // empty'
          }
          ghdl=$(label "$GHDL_IMAGE:latest" ghdl.commit)
          gcc=$(label "$GCC_IMAGE:latest" riscv-gnu-toolchain.commit)
          # the picolibc the GCC image was built against, and the latest picolibc image: the GCC
          # image must have been built against the latest one, or its build is still to come
          picolibc=$(label "$GCC_IMAGE:latest" picolibc.commit)
          picolibc_latest=$(label "$PICOLIBC_IMAGE:latest" picolibc.commit)
          spike=$(label "$SPIKE_IMAGE:latest" riscv-isa-sim.commit)
          yosys=$(label "$YOSYS_IMAGE:latest" yosys.commit)
          sby=$(label "$YOSYS_IMAGE:latest" sby.commit)
          if [ -z "$ghdl" ] || [ -z "$gcc" ] || [ -z "$picolibc" ] || [ "$picolibc" != "$picolibc_latest" ] || [ -z "$spike" ] || [ -z "$yosys" ] || [ -z "$sby" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::could not read the commits from the latest GHDL, GCC, picolibc, Spike and Yosys images, or the GCC image was not built against the latest picolibc; run the Picolibc image, GCC image, GHDL image, Spike image and Yosys image workflows first"
              exit 1
            fi
            # A run can start before the components exist (the merge that
            # adds them also changes this workflow); their runs trigger this
            # one when they finish.
            echo "::notice::the GHDL, GCC, picolibc, Spike and Yosys images are not all published yet (or the GCC image is not the one built against the latest picolibc); their runs trigger this workflow when they finish."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ghdl=$ghdl" >> "$GITHUB_OUTPUT"
          echo "gcc=$gcc" >> "$GITHUB_OUTPUT"
          echo "picolibc=$picolibc" >> "$GITHUB_OUTPUT"
          echo "spike=$spike" >> "$GITHUB_OUTPUT"
          echo "yosys=$yosys" >> "$GITHUB_OUTPUT"
          echo "sby=$sby" >> "$GITHUB_OUTPUT"
          echo "short=ghdl-${ghdl:0:7}-gcc-${gcc:0:7}-picolibc-${picolibc:0:7}-spike-${spike:0:7}-yosys-${yosys:0:7}-sby-${sby:0:7}-uv-${UV}" >> "$GITHUB_OUTPUT"

      - name: Decide whether there is anything to assemble now
        # Nothing to do when a component is not published yet, when a component run is still queued
        # or going (its end triggers this workflow again, so the last one to finish does the single
        # assembly), or when this run (scheduled, or triggered by a component workflow that found
        # its image already published and still ended successfully) is for a combination that
        # exists. A manual run never defers and always builds.
        id: skip
        env:
          EVENT: ${{ github.event_name }}
          MISSING: ${{ steps.pins.outputs.missing }}
          COMBINATION: ${{ steps.pins.outputs.short }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pending=0
          if [ "$EVENT" != "workflow_dispatch" ]; then
            for workflow in ghdl-image.yml gcc-image.yml picolibc-image.yml spike-image.yml yosys-image.yml; do
              for status in queued in_progress; do
                # A workflow GitHub does not know yet (the merge that adds
                # them together) makes this fail; count it as none.
                count=$(gh run list -R "$REPO" --workflow "$workflow" --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)
                pending=$((pending + count))
              done
            done
          fi

          if [ "$MISSING" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$pending" -gt 0 ]; then
            echo "::notice::a GHDL, GCC, picolibc, Spike or Yosys image run is still going; it triggers this workflow when it finishes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "workflow_dispatch" ] && docker buildx imagetools inspect "$IMAGE:$COMBINATION" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$COMBINATION already exists; nothing to assemble."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each assembled on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/infra-toolchain
      dockerfile: Dockerfile
      title: Insper RISC-V toolchain
      description: GHDL, the RISC-V GCC with picolibc, Spike, Yosys with SymbiYosys, uv, Python and cocotb, for linux/amd64 and linux/arm64.
      timeout-minutes: 60
      build-args: |
        GHDL_IMAGE=ghcr.io/${{ github.repository_owner }}/infra-ghdl:${{ needs.pin.outputs.ghdl }}
        UV_VERSION=${{ needs.pin.outputs.uv }}
        GCC_IMAGE=ghcr.io/${{ github.repository_owner }}/infra-gcc:${{ needs.pin.outputs.gcc }}-${{ needs.pin.outputs.picolibc }}
        SPIKE_IMAGE=ghcr.io/${{ github.repository_owner }}/infra-spike:${{ needs.pin.outputs.spike }}
        YOSYS_IMAGE=ghcr.io/${{ github.repository_owner }}/infra-yosys:${{ needs.pin.outputs.yosys }}-${{ needs.pin.outputs.sby }}
      labels: |
        uv.version=${{ needs.pin.outputs.uv }}
        ghdl.commit=${{ needs.pin.outputs.ghdl }}
        riscv-gnu-toolchain.commit=${{ needs.pin.outputs.gcc }}
        picolibc.commit=${{ needs.pin.outputs.picolibc }}
        riscv-isa-sim.commit=${{ needs.pin.outputs.spike }}
        yosys.commit=${{ needs.pin.outputs.yosys }}
        sby.commit=${{ needs.pin.outputs.sby }}
      tags: |
        latest
        sha-${{ github.sha }}
        ${{ needs.pin.outputs.short }}
      check: |
        ghdl --version | head -n 1
        riscv32-unknown-elf-gcc --version | head -n 1
        riscv32-unknown-elf-gcc --specs=picolibc.specs -E -x c /dev/null -o /dev/null
        test "$(riscv32-unknown-elf-gcc -print-multi-lib)" = ".;"
        grep -h '__PICOLIBC_VERSION__' /opt/riscv-foundation/riscv32-elf/riscv32-unknown-elf/include/picolibc.h | head -n 1
        out=$(spike --isa=rv32i -m0x0:0x10000 --pc=0 --disable-dtb /dev/null 2>&1 || true)
        if echo "$out" | grep -q overlap; then echo "Spike still places its debug module at address 0"; exit 1; fi
        yosys -V | head -n 1
        sby --version
        uv --version
        python3 -c "import cocotb, sys; assert sys.version_info[:2] == (3, 14); print(cocotb.__version__)"
