name: GHDL image

# Builds GHDL with the LLVM backend (the mcode backend is x86 only, so the same recipe builds both
# architectures) alone and publishes it as base-ghdl for linux/amd64 and linux/arm64, tagged with
# the ghdl/ghdl commit and as latest.
#
# - Run by hand to update GHDL: it builds the commit given, or the latest commit of the upstream
#   default branch whose CI is green (waiting for a run that is still going), unless that image
#   already exists. The image follows the 7.0.0-dev line: the GHDL plugin for Yosys needs an API of
#   GHDL that the 6.0.0 release does not have, and the plugin follows the Yosys of its image. The
#   commit is the latest one on which upstream's Pipeline workflow passed (.github/scripts/green-commit.sh).
# - Runs every day (schedule): it takes the latest commit of the upstream default branch whose CI is
#   green and builds it only if that image does not exist yet.
#   A change of Dockerfile or of this workflow does not build by itself, so a recipe
#   change that is not a new version does not rebuild an image for nothing: the Recipe
#   changed workflow warns about it, and a run by hand with `force` rebuilds.
#
# The CI images workflow then assembles a new image.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "ghdl commit to build (empty: the latest commit of its default branch whose CI is green)"
        required: false
      ignore_ci:
        description: "With no commit given, take the head of the default branch whatever its CI says"
        type: boolean
        default: false
      force:
        description: "Rebuild and republish even if the image for that commit already exists"
        type: boolean
        default: false

concurrency:
  group: ghdl-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/base-ghdl
  UPSTREAM: https://github.com/ghdl/ghdl
  LABEL: ghdl.commit

jobs:
  pin:
    # Only decides what to build: the published image, tagged by commit, is what a later run
    # checks to skip the build.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      version: ${{ steps.pin.outputs.version }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # scheduled run skips this: branch protection on main is the gate for
        # that path instead.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test the choice of the commit
        # The selection (wait for a running commit, skip a failed one, accept a re-run) against
        # canned answers of the GitHub API: no network.
        run: bash .github/scripts/test-green-commit.sh

      - name: Resolve the commit
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_IGNORE_CI: ${{ inputs.ignore_ci }}
          INPUT_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_commit() {
            if [ "$INPUT_IGNORE_CI" = "true" ]; then
              git ls-remote "$UPSTREAM" HEAD | cut -f1
            else
              # the latest commit on which upstream's workflow succeeded; it waits for a run that is
              # still going and goes back past a commit that failed
              UPSTREAM_REPO=ghdl/ghdl \
                REQUIRED_WORKFLOWS="Pipeline.yml" \
                .github/scripts/green-commit.sh
            fi
          }

          force="$INPUT_FORCE"
          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ]; then
            commit=$(upstream_commit)
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          # the version of the release whose tag points at the commit (empty for a commit that is not a release),
          # which the image writes in its .tag
          . .github/scripts/name-of.sh
          echo "version=$(version_of "$UPSTREAM" "$commit")" >> "$GITHUB_OUTPUT"

          if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$commit already exists; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $commit."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/base-ghdl
      dockerfile: docker/base/ghdl/Dockerfile
      title: GHDL (LLVM backend)
      description: GHDL, the VHDL simulator, with the LLVM backend, built from source. Only the install directory, /opt/ghdl.
      timeout-minutes: 240
      build-args: |
        GHDL_COMMIT=${{ needs.pin.outputs.commit }}
        GHDL_VERSION=${{ needs.pin.outputs.version }}
      labels: |
        ghdl.commit=${{ needs.pin.outputs.commit }}
        ghdl.version=${{ needs.pin.outputs.version }}
      tags: |
        ${{ needs.pin.outputs.commit }}
        latest
