name: GHDL image

# Builds GHDL with the LLVM backend (the mcode backend is x86 only, so the same recipe builds both
# architectures) alone and publishes it as infra-ghdl for linux/amd64 and linux/arm64, tagged with
# the ghdl/ghdl commit and as latest.
#
# - Run by hand to update GHDL: it builds the commit given, or the commit of the latest release tag
#   of the series set in SERIES (6.x.y), unless that image already exists.
# - Runs on a push to main that changes Dockerfile.ghdl or this workflow: it rebuilds the commit
#   latest already has (the recipe changed, not the version), or the upstream latest release when
#   nothing is published yet.
#
# The Toolchain image workflow then assembles a new complete image.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ghdl
      - .github/workflows/ghdl-image.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret IMAGE_PUBLISH_SECRET's value, to confirm you're allowed to publish the image"
        required: true
      commit:
        description: "ghdl commit to build (empty: the latest release tag of the upstream)"
        required: false
      force:
        description: "Rebuild and republish even if the image for that commit already exists"
        type: boolean
        default: false

concurrency:
  group: ghdl-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/infra-ghdl
  UPSTREAM: https://github.com/ghdl/ghdl
  LABEL: ghdl.commit
  # the major version of GHDL the image follows; a new series is chosen by editing this line
  SERIES: "6"

jobs:
  pin:
    # Only decides what to build: the published image, tagged by commit, is what a later run
    # checks to skip the build.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      build: ${{ steps.pin.outputs.build }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already gates
        # who can trigger this, but on a repo shared with people who
        # shouldn't publish the image, this adds a second check: only
        # someone who separately knows IMAGE_PUBLISH_SECRET can run it. A
        # push to main skips this: branch protection on main is the gate for
        # that path instead.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
          SECRET: ${{ secrets.IMAGE_PUBLISH_SECRET }}
        run: |
          if [ "$CONFIRM" != "$SECRET" ]; then
            echo "::error::confirmation does not match IMAGE_PUBLISH_SECRET, refusing to publish the image"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the commit
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          latest_commit() {
            docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r --arg key "$LABEL" '."linux/amd64".config.Labels[$key] // empty' 2>/dev/null || true
          }
          upstream_commit() {
            # the commit of the latest stable release tag of the series SERIES (v6.x.y), not of a
            # moving branch, and not of a newer series: moving to the next one is an edit of SERIES
            tag=$(git ls-remote --tags --refs "$UPSTREAM" "v${SERIES}.*" | sed 's|.*refs/tags/||' \
                  | grep -E "^v${SERIES}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
            if [ -z "$tag" ]; then
              echo "::error::no release tag of the series ${SERIES} in $UPSTREAM" >&2
              return 1
            fi
            # an annotated tag has a second line, peeled to the commit (^{}); a lightweight one is the commit
            git ls-remote "$UPSTREAM" "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n 1 | cut -f1
          }

          force="$INPUT_FORCE"
          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ] && [ "$EVENT" = "push" ]; then
            # The recipe changed: rebuild what latest already holds.
            commit=$(latest_commit)
            force=true
          fi
          if [ -z "$commit" ]; then
            commit=$(upstream_commit)
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::not a full commit hash: $commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if [ "$force" != "true" ] && docker buildx imagetools inspect "$IMAGE:$commit" > /dev/null 2>&1; then
            echo "::notice::$IMAGE:$commit already exists; nothing to build (run again with force to rebuild)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $commit."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    # linux/amd64 and linux/arm64, each built on a runner of its own architecture, then one
    # manifest (build-image.yml).
    needs: pin
    if: needs.pin.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/infra-ghdl
      dockerfile: Dockerfile.ghdl
      title: GHDL (LLVM backend)
      description: GHDL, the VHDL simulator, with the LLVM backend, built from source. Only the install directory, /opt/ghdl.
      timeout-minutes: 240
      build-args: GHDL_COMMIT=${{ needs.pin.outputs.commit }}
      labels: ghdl.commit=${{ needs.pin.outputs.commit }}
      tags: |
        ${{ needs.pin.outputs.commit }}
        latest
